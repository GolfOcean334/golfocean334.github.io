<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Axel Gathelier</title>
    <meta name="description" content="Contacte Axel Gathelier, développeur de jeux vidéo, pour échanger sur un projet, un stage ou une collaboration.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Contact - Axel Gathelier">
    <meta property="og:description" content="Un projet, un stage, une collaboration ? Écris-moi.">
    <meta name="theme-color" content="#A0784A">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎮%3C/text%3E%3C/svg%3E">
    <script>(function(){var d=document.documentElement;d.classList.add('js');if(!window.CSSViewTransitionRule)d.classList.add('no-vt');try{if(localStorage.getItem('portfolio-theme')==='night')d.setAttribute('data-theme','night')}catch(e){}})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap"></noscript>
    <link rel="stylesheet" href="css/styles.css">
    <script defer src="js/script.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script defer src="js/contact.js"></script>
    <script defer src="js/cv.js"></script>
    <script defer src="js/theme.js"></script>
    <script defer src="js/transitions.js"></script>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar" aria-label="Navigation principale">
        <ul>
            <li><a href="index.html" id="nav-home-link">Accueil</a></li>
            <li><a href="list_projects.html" id="nav-projects-link">Projets</a></li>
            <li><a href="contact.html" id="nav-contact-link" class="active" aria-current="page">Contact</a></li>
        </ul>
    </nav>

    <main class="plain">
        <section class="contact-content">
            <h1>Contactez-moi</h1>
            <form id="contact-form">
                <label for="name">Votre nom :</label>
                <input type="text" id="name" name="name" autocomplete="name" required>

                <label for="email">Votre adresse e-mail :</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="subject">Le sujet du message :</label>
                <input type="text" id="subject" name="subject" required>

                <label for="message">Votre message :</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <!-- Champ piège anti-robots (laissé vide par les humains) -->
                <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

                <div class="captcha">
                    <h4>Veuillez résoudre ce captcha :</h4>
                    <label for="captcha" id="captcha-label">Captcha : …</label>
                    <input type="text" id="captcha" name="captcha" inputmode="numeric" autocomplete="off" required>
                </div>

                <button type="submit" class="btn">Envoyer</button>
                <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p class="copyright">© 2026 Axel Gathelier</p>
    </footer>

</body>
</html>
